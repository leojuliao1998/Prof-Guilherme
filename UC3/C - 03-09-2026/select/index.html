<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ^ div.container>div.formulario>form (emmet) -->
    <div class="container">
        <div class="formulario">
            <form action="">
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome">

                <!-- 
                todo Atributos das tags
                * type = tipo do input (Tipo de dado)
                ^ name = vai ser usado só no back-end
                * id = para identificar no JavaScript
                ^ action = usado no back-end
                * placeholder = texto prévio dentro da caixa de texto antes da pessoa digitar
                -->
                <select name="linguagem" id="linguagem">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="csharp">C#</option>
                    <option value="ruby">Ruby</option>
                </select>
            </form>
            <!-- todo button#selecionar{Selecione} -->
            <button id="selecionar">Selecione</button>
        </div>
    </div>



    <script src="script/script.js"></script>
</body>
</html>
